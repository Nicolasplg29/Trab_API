<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban — Trabalho Bimestral NASA API</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050810;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #58a6ff;
      --accent2: #bc8cff;
      --green: #3fb950;
      --amber: #d29922;
      --red: #f85149;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 75% 85%, rgba(255,255,255,0.15) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(5,8,16,0.85);
      backdrop-filter: blur(12px);
    }

    .logo-badge {
      background: var(--accent);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .logo-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
    }

    .col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .col-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .col-title.todo { color: var(--accent); }
    .col-title.doing { color: var(--amber); }
    .col-title.done { color: var(--green); }

    .col-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
    }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.2s, transform 0.15s;
      animation: fadeIn 0.3s ease both;
    }

    .card:last-child { margin-bottom: 0; }
    .card:hover { border-color: var(--border-hover); transform: translateY(-1px); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
    }

    .tag-blue  { border-color: rgba(88,166,255,0.4); color: var(--accent); }
    .tag-amber { border-color: rgba(210,153,34,0.4); color: var(--amber); }
    .tag-green { border-color: rgba(63,185,80,0.4);  color: var(--green); }
    .tag-gray  { border-color: var(--border); color: var(--muted); }
    .tag-purple{ border-color: rgba(188,140,255,0.4); color: var(--accent2); }

    .priority {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }

    .priority.alta  { color: var(--red); }
    .priority.media { color: var(--amber); }
    .priority.baixa { color: var(--green); }

    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-badge">NASA</div>
  <div>
    <div class="logo-title">KANBAN — TRABALHO BIMESTRAL</div>
    <div class="logo-sub">NASA API · gestão de tarefas</div>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<div class="footer">// atualizado em <span id="date"></span></div>

<script>
  document.getElementById('date').textContent = new Date().toLocaleDateString('pt-BR');

  const columns = [
    {
      id: 'todo',
      label: 'A fazer',
      class: 'todo',
      cards: [
        { title: 'Definir dupla e tema do projeto', tags: [{ label: 'planejamento', cls: 'tag-gray' }], priority: 'alta' },
        { title: 'Explorar todos os endpoints da NASA', tags: [{ label: 'pesquisa', cls: 'tag-blue' }], priority: 'alta' },
        { title: 'Escolher qual endpoint usar no trabalho', tags: [{ label: 'pesquisa', cls: 'tag-blue' }], priority: 'alta' },
        { title: 'Criar board Kanban oficial no Trello/Notion', tags: [{ label: 'planejamento', cls: 'tag-gray' }], priority: 'media' },
        { title: 'Desenhar a interface do projeto', tags: [{ label: 'design', cls: 'tag-amber' }], priority: 'media' },
        { title: 'Criar estrutura de pastas do projeto', tags: [{ label: 'código', cls: 'tag-blue' }], priority: 'media' },
        { title: 'Implementar interface final com HTML/CSS', tags: [{ label: 'design', cls: 'tag-amber' }, { label: 'código', cls: 'tag-blue' }], priority: 'media' },
        { title: 'Apresentar o projeto para a turma', tags: [{ label: 'entrega', cls: 'tag-purple' }], priority: 'baixa' },
      ]
    },
    {
      id: 'doing',
      label: 'Em andamento',
      class: 'doing',
      cards: [
        { title: 'Testar GETs e entender o JSON retornado', tags: [{ label: 'código', cls: 'tag-blue' }], priority: 'alta' },
        { title: 'Montar o Kanban com tarefas do bimestre', tags: [{ label: 'planejamento', cls: 'tag-gray' }], priority: 'alta' },
      ]
    },
    {
      id: 'done',
      label: 'Concluído',
      class: 'done',
      cards: [
        { title: 'Criar conta e gerar API key da NASA', tags: [{ label: 'feito', cls: 'tag-green' }], priority: '' },
        { title: 'Acessar a documentação da NASA', tags: [{ label: 'feito', cls: 'tag-green' }], priority: '' },
        { title: 'Instalar Python e biblioteca requests', tags: [{ label: 'feito', cls: 'tag-green' }], priority: '' },
        { title: 'Fazer primeiro GET com sucesso (APOD)', tags: [{ label: 'feito', cls: 'tag-green' }], priority: '' },
      ]
    },
  ];

  const board = document.getElementById('board');

  columns.forEach((col, ci) => {
    const el = document.createElement('div');
    el.className = 'col';
    el.innerHTML = `
      <div class="col-header">
        <span class="col-title ${col.class}">${col.label}</span>
        <span class="col-count">${col.cards.length}</span>
      </div>
      ${col.cards.map((card, i) => `
        <div class="card" style="animation-delay: ${(ci * 0.1) + (i * 0.05)}s">
          <div class="card-title">${card.title}</div>
          <div class="card-meta">
            ${card.tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('')}
            ${card.priority ? `<span class="priority ${card.priority}">· ${card.priority}</span>` : ''}
          </div>
        </div>`).join('')}`;
    board.appendChild(el);
  });
</script>
</body>
</html>
