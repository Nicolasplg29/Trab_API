<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA OMNI EXPLORER | UniCV 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050810;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(255,255,255,0.25);
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #58a6ff;
      --accent2: #bc8cff;
      --green: #3fb950;
      --red: #f85149;
      --amber: #d29922;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; display: flex; height: 100vh; overflow: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(2px 2px at 50% 60%, rgba(255,255,255,0.2) 0%, transparent 100%);
    }

    .sidebar { width: 300px; background: rgba(5,8,16,0.9); backdrop-filter: blur(10px); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .brand { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .logo-badge { background: var(--accent); color: #000; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
    .logo-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1px; }

    .nav-scroll { flex: 1; overflow-y: auto; padding: 1rem 0; }
    .nav-section { padding: 1rem 1.5rem 0.5rem; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-family: 'Syne', sans-serif; font-weight: 700; }
    .nav-btn { width: 100%; text-align: left; background: none; border: none; padding: 12px 1.5rem; color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
    .nav-btn:hover { background: rgba(255,255,255,0.05); }
    .nav-btn.active { background: rgba(88,166,255,0.1); border-left-color: var(--accent); color: var(--accent); font-weight: 700; }

    .main { flex: 1; display: flex; flex-direction: column; z-index: 1; overflow-y: auto; position: relative; }
    
    .module-header { padding: 2rem 2.5rem; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(13,17,23,0.8) 0%, transparent 100%); }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 15px;}
    .module-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem; color: var(--text); text-transform: uppercase; }
    
    .server-status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); background: var(--surface2); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .docs-panel { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .docs-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700;}
    .docs-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 15px;}
    
    .docs-tips { background: rgba(88,166,255,0.05); border: 1px solid rgba(88,166,255,0.2); padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 12px; line-height: 1.6;}
    .docs-tips ul { list-style: none; padding-left: 0; margin-top: 8px; }
    .docs-tips ul li { color: var(--text); margin-bottom: 6px; }
    .docs-tips ul li::before { content: '>'; color: var(--accent); margin-right: 8px; font-weight: bold;}

    .docs-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 12px; background: #000; padding: 15px; border-radius: 6px; border: 1px solid var(--border);}
    .docs-specs span { color: var(--green); }

    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input[type=text], input[type=date], input[type=number] { background: var(--surface2); border: 1px solid var(--border); color: #fff; font-family: 'Space Mono', monospace; font-size: 14px; padding: 10px 15px; border-radius: 6px; outline: none; width: 220px; transition: 0.2s; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .btn { background: var(--accent); color: #000; border: none; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; padding: 10px 24px; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn:hover { background: #fff; transform: translateY(-2px); }

    .content-area { padding: 2.5rem; }

    .home-box { text-align: center; padding: 3rem 2rem; background: linear-gradient(180deg, rgba(88,166,255,0.05) 0%, transparent 100%); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 2rem; }
    .home-box h2 { font-family: 'Syne', sans-serif; font-size: 28px; color: var(--text); letter-spacing: 2px; margin-bottom: 10px; }
    .home-box p { color: var(--accent); font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    
    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .home-card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; line-height: 1.6; }
    .home-card h3 { color: var(--accent); margin-bottom: 15px; font-family: 'Syne', sans-serif; font-size: 18px; letter-spacing: 1px; }
    .home-card p { font-size: 14px; color: var(--muted); margin-bottom: 15px; }
    .home-card ul { list-style: none; font-size: 13px; color: var(--text); }
    .home-card ul li { margin-bottom: 8px; display: flex; align-items: center; gap: 8px;}
    .home-card ul li::before { content: '■'; color: var(--accent); font-size: 8px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .table-container { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: var(--surface2); padding: 12px 16px; font-family: 'Syne', sans-serif; font-weight: 700; border-bottom: 1px solid var(--border); color: var(--accent); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); }
    tr:hover td { color: #fff; background: rgba(255,255,255,0.02); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; cursor: pointer; }
    .card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--border); }
    .card-body { padding: 20px; flex: 1; }
    
    .tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 15px; border: 1px solid var(--border); background: var(--surface2); }
    .tag.danger { border-color: var(--red); color: var(--red); background: rgba(248,81,73,0.1); }
    .tag.success { border-color: var(--green); color: var(--green); background: rgba(63,185,80,0.1); }
    .tag.warning { border-color: var(--amber); color: var(--amber); background: rgba(210,153,34,0.1); }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 10px; line-height: 1.3; }
    .card-info { font-size: 13px; color: var(--muted); line-height: 1.6; }

    .apod-frame { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .apod-frame img, .apod-frame iframe { width: 100%; max-width: 500px; border-radius: 8px; border: 1px solid var(--border); }
    .apod-data { flex: 1; min-width: 280px; }
    .apod-data h2 { font-family: 'Syne', sans-serif; font-size: 28px; margin-bottom: 10px; color: var(--text); line-height: 1.2;}
    .apod-data p { color: var(--muted); font-size: 14px; line-height: 1.8; margin-top: 20px; }

    /* Earth Imagery */
    .earth-frame { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .earth-frame img { width: 100%; max-width: 480px; border-radius: 8px; border: 1px solid var(--border); background: #000; }
    .earth-data { flex: 1; min-width: 260px; }
    .earth-data h2 { font-family: 'Syne', sans-serif; font-size: 24px; margin-bottom: 12px; color: var(--text); }
    .earth-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .earth-meta-box { background: var(--surface2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; }
    .earth-meta-label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .earth-meta-val { font-size: 14px; color: #fff; font-family: 'Space Mono', monospace; }

    .insight-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; width: 100%; margin-top: 15px; }
    .insight-widget { background: var(--surface2); border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; }
    .insight-label { font-size: 11px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
    .insight-val { font-size: 20px; font-weight: 700; color: #fff; }

    .tle-telemetry { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 12px; margin-bottom: 24px; }
    .tle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 15px; }
    .tle-box { background: var(--surface2); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
    .tle-label { font-size: 11px; color: var(--accent2); text-transform: uppercase; margin-bottom: 4px;}
    .tle-val { font-size: 18px; font-weight: 700; color: #fff; font-family: 'Space Mono', monospace; }

    .terminal { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 20px; font-size: 13px; line-height: 1.6; overflow-x: auto; }
    .syn-key { color: var(--accent); } .syn-str { color: var(--green); } .syn-num { color: var(--amber); }

    .status-msg { font-size: 13px; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .alert-box { border: 1px solid var(--red); background: rgba(248,81,73,0.1); padding: 30px; border-radius: 12px; text-align: center; max-width: 800px; margin: 0 auto; animation: fadeIn 0.3s ease;}
    .alert-box h2 { color: var(--red); font-family: 'Syne', sans-serif; font-size: 24px; margin-bottom: 15px; letter-spacing: 2px;}
    .alert-box p { color: var(--text); line-height: 1.6; margin-bottom: 10px;}
    .code-cmd { background: #000; color: var(--green); padding: 15px; font-family: 'Space Mono', monospace; font-size: 14px; border: 1px solid #333; border-radius: 6px; display: inline-block; margin-top: 15px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem; backdrop-filter: blur(5px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; animation: fadeIn 0.2s ease; }
    .modal img { width: 100%; max-height: 500px; object-fit: contain; background: #000; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 1.5rem; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; }
    .close-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    
    @media (max-width: 768px) {
      .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .controls { flex-direction: column; align-items: stretch; }
      input[type=text], input[type=date], input[type=number] { width: 100%; }
      .home-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-badge">NASA</div>
      <div class="logo-title">OMNI-GATEWAY</div>
      <button onclick="toggleMenu()" style="margin-left:auto; background:none; border:none; color:#fff; display:none;" id="close-menu">✕</button>
    </div>
    
    <div class="nav-scroll">
      <button class="nav-btn active" style="margin-bottom: 10px;" onclick="selectModule('home', this)">> PÁGINA INICIAL</button>
      
      <div class="nav-section">Exploração Visual</div>
      <button class="nav-btn" onclick="selectModule('apod', this)">> APOD (Foto do Dia)</button>
      <button class="nav-btn" onclick="selectModule('epic', this)">> Câmera EPIC (Terra)</button>
      <button class="nav-btn" onclick="selectModule('earth', this)">> Imagens da Terra (Landsat)</button>
      <button class="nav-btn" onclick="selectModule('library', this)">> Acervo de Mídia</button>
      <button class="nav-btn" onclick="selectModule('rovers', this)">> Robôs em Marte</button>

      <div class="nav-section">Monitoramento</div>
      <button class="nav-btn" onclick="selectModule('neows', this)">> Radar NeoWs (Asteroides)</button>
      <button class="nav-btn" onclick="selectModule('eonet', this)">> EONET (Desastres)</button>
      <button class="nav-btn" onclick="selectModule('tech', this)">> Patentes da NASA</button>

      <div class="nav-section">Dados Científicos</div>
      <button class="nav-btn" onclick="selectModule('exoplanet', this)">> Exoplanetas (Kepler)</button>
      <button class="nav-btn" onclick="selectModule('ssd', this)">> SSD (Meteoros)</button>
      <button class="nav-btn" onclick="selectModule('tle', this)">> Órbita TLE (Satélites)</button>
      <button class="nav-btn" onclick="selectModule('insight', this)">> Clima em Marte</button>
      <button class="nav-btn" onclick="selectModule('raw', this)">> Repositórios Abertos</button>
    </div>
  </aside>

  <main class="main">
    
    <div class="module-header" id="module-header">
      <div class="top-bar">
        <h1 class="module-title" id="mod-title">CENTRAL DE COMANDO</h1>
        <div class="server-status">
          <div class="dot" id="server-dot"></div>
          <span id="server-text">Analisando conexão FastAPI...</span>
          <button onclick="toggleMenu()" style="display:none; background:none; border:none; color:#fff; font-size:20px; margin-left:10px;" id="open-menu">☰</button>
        </div>
      </div>
      
      <div class="docs-panel" id="docs-panel" style="display:none;">
        <div class="docs-title">Manual do Endpoint</div>
        <div class="docs-desc" id="mod-desc">Descrição...</div>
        <div class="docs-tips" id="mod-tips" style="display:none;"></div>
        <div class="docs-specs">
          <div><b>ROTA FASTAPI:</b> <span id="mod-call">GET /...</span></div>
          <div><b>RETORNO:</b> <span id="mod-return">JSON...</span></div>
        </div>
      </div>

      <div class="controls" id="mod-controls" style="display:none;">
        <!-- controles injetados dinamicamente -->
      </div>
    </div>

    <div class="content-area">
      <div class="status-msg" id="status" style="display:none;">Aguardando comando do operador...</div>
      <div id="render-zone"></div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal"></div>
  </div>

  <script>
    const MODULES = {
      home: { title: "CENTRAL DE COMANDO" },
      apod: {
        title: "Astronomy Picture of the Day",
        desc: "A NASA seleciona diariamente uma foto ou vídeo astronômico e fornece uma explicação detalhada.",
        tips: "<b>Filtro Temporal:</b> Selecione qualquer data a partir de 16 de Junho de 1995 no campo abaixo para resgatar dados históricos do APOD.",
        call: "GET /apod?date={AAAA-MM-DD}", return: "Objeto JSON com URL da mídia, título e explicação.",
        path: "/apod", inputType: "date", paramKey: "date"
      },
      epic: {
        title: "Câmera EPIC (Planeta Terra)",
        desc: "Imagens reais diárias do nosso planeta (full disc) capturadas pelo satélite DSCOVR a 1 milhão de milhas de distância.",
        call: "GET /epic/natural", return: "Array de metadados. O Front-end calcula a URL da imagem.",
        path: "/epic/natural"
      },
      earth: {
        title: "Imagens da Terra — Landsat 8",
        desc: "Satélite Landsat 8 da NASA/USGS fotografa qualquer ponto da superfície terrestre a cada 16 dias. Insira as coordenadas geográficas para obter a imagem de satélite mais recente daquele local.",
        tips: "<b>Coordenadas de Exemplo:</b><ul><li>São Paulo: Lat -23.55 / Lon -46.63</li><li>Rio de Janeiro: Lat -22.90 / Lon -43.17</li><li>Brasília: Lat -15.78 / Lon -47.93</li><li>Amazon River: Lat -3.10 / Lon -60.02</li></ul>",
        call: "GET /earth/assets?lat={lat}&lon={lon}", return: "Metadados da imagem disponível + URL Landsat 8.",
        path: "/earth/assets", inputType: "latlon"
      },
      library: {
        title: "NASA Image & Video Library",
        desc: "Mecanismo de busca oficial da NASA para imagens e vídeos históricos.",
        tips: "<b>Sugestões de Busca (em inglês):</b><ul><li>apollo 11</li><li>mars rover</li><li>black hole</li><li>nebula</li></ul>",
        call: "GET /library/search?q={termo}", return: "Coleção de itens com links de imagens e metadados.",
        path: "/library/search", inputType: "text", paramKey: "q", placeholder: "Digite um termo de busca..."
      },
      rovers: {
        title: "Câmeras em Marte",
        desc: "Fotos reais enviadas pelos robôs exploradores da superfície marciana.",
        call: "GET /mars/curiosity/photos", return: "Array de fotos e dados das câmeras.",
        path: "/mars/curiosity/photos"
      },
      neows: {
        title: "Radar NeoWs (Asteroides)",
        desc: "Serviço que lista os asteroides que estão se aproximando ou passando perto da Terra hoje.",
        call: "GET /neows/feed", return: "Dicionário de datas com tamanho, velocidade e risco de impacto.",
        path: "/neows/feed"
      },
      eonet: {
        title: "Desastres Naturais (EONET)",
        desc: "Monitoramento por satélite de eventos naturais críticos acontecendo no globo terrestre agora.",
        call: "GET /eonet/events", return: "Array de eventos abertos (vulcões, tempestades, icebergs).",
        path: "/eonet/events"
      },
      tech: {
        title: "Patentes da NASA",
        desc: "Acesso estruturado às patentes de engenharia e tecnologia desenvolvidas pela agência espacial.",
        tips: "<b>Áreas de Pesquisa Comuns:</b><ul><li>materials</li><li>laser</li><li>engine</li><li>software</li></ul>",
        call: "GET /techtransfer/patent?q={termo}", return: "Array de projetos com Número da Patente, Título e Blueprint.",
        path: "/techtransfer/patent", inputType: "text", paramKey: "q", placeholder: "Digite um termo em inglês..."
      },
      exoplanet: {
        title: "Exoplanetas Confirmados",
        desc: "Arquivo do telescópio Kepler listando planetas fora do nosso sistema solar.",
        call: "GET /exoplanet/planets", return: "Array SQL em JSON com dados orbitais e estrela hospedeira.",
        path: "/exoplanet/planets"
      },
      ssd: {
        title: "Impactos Atmosféricos (Fireballs)",
        desc: "Relatório de sensores que detectam bolas de fogo explodindo na atmosfera da Terra.",
        call: "GET /ssd/fireball", return: "Matriz de dados de meteoros e poeira cometária.",
        path: "/ssd/fireball"
      },
      tle: {
        title: "Órbitas TLE (Satélites)",
        desc: "Rastreamento orbital (Two Line Element) para calcular a posição exata de satélites no espaço.",
        tips: "<b>Satélites Catalogados:</b><ul><li>ISS</li><li>HUBBLE</li><li>AQUA</li><li>TIANGONG</li></ul>",
        call: "GET /tle/search?search={nome}", return: "JSON com os elementos orbitais matemáticos.",
        path: "/tle/search", inputType: "text", paramKey: "search", placeholder: "Ex: ISS, HUBBLE, NOAA..."
      },
      insight: {
        title: "Clima em Marte (InSight)",
        desc: "Tentativa de conexão com a sonda InSight para obter telemetria marciana.",
        call: "GET /insight", return: "Aviso de status + telemetria de contingência.",
        path: "/insight"
      },
      raw: {
        title: "Repositório de Ciência Aberta",
        desc: "Pesquisa avançada em bases genéticas, amostras de tecido enviadas ao espaço e biologia espacial.",
        tips: "<b>Filtros de Bio-Pesquisa:</b><ul><li>space</li><li>tissue</li><li>radiation</li></ul>",
        call: "GET /osdr/search?term={termo}", return: "Estrutura JSON para análise técnica e científica.",
        path: "/osdr/search", inputType: "text", paramKey: "term", placeholder: "Digite o termo biológico..."
      }
    };

    let currentApiId = 'home';

    window.onload = () => {
      renderHome();
      checkServer();
      setInterval(checkServer, 5000);
    };

    async function checkServer() {
      const dot = document.getElementById('server-dot');
      const txt = document.getElementById('server-text');
      try {
        const res = await fetch('http://127.0.0.1:8000/', { signal: AbortSignal.timeout(2000) });
        if (res.ok) { dot.className = 'dot online'; txt.innerText = 'Servidor FastAPI Online'; }
        else throw new Error();
      } catch {
        dot.className = 'dot offline'; txt.innerText = 'Servidor Offline';
      }
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

    function selectModule(id, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentApiId = id;
      if (id === 'home') { renderHome(); } else { updateModuleUI(id); }
    }

    function renderHome() {
      document.getElementById('mod-title').innerText = MODULES['home'].title;
      document.getElementById('docs-panel').style.display = 'none';
      document.getElementById('mod-controls').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      document.getElementById('render-zone').innerHTML = `
        <div class="home-box">
          <h2>EQUIPE DE DESENVOLVIMENTO</h2>
          <p>NÍCOLAS • TIAGO • JHONATAN</p>
        </div>
        <div class="home-grid">
          <div class="home-card">
            <h3>SOBRE A MISSÃO (TRABALHO)</h3>
            <p>Gateway FastAPI (Back-end) que atua como intermediário absoluto entre este painel visual e os servidores oficiais da NASA.</p>
            <p>Nenhuma requisição direta é enviada à NASA pelo navegador — toda comunicação passa pelo back-end Python com cache TTL, retry automático e tratamento de erros centralizado.</p>
          </div>
          <div class="home-card">
            <h3>APIs MAPEADAS (ENDPOINTS GET)</h3>
            <ul>
              <li>APOD (Astronomy Picture of the Day)</li>
              <li>Earth Imagery / Assets (Landsat 8)</li>
              <li>NeoWs (Monitoramento de Asteroides)</li>
              <li>DONKI (Clima e Explosões Solares)</li>
              <li>EONET (Eventos Naturais Terrestres)</li>
              <li>EPIC (Imagens do Satélite DSCOVR)</li>
              <li>Exoplanet Archive (Telescópio Kepler)</li>
              <li>GIBS / Trek WMTS (Mapeamentos XML)</li>
              <li>InSight (Sonda Marciana - Descontinuada)</li>
              <li>NASA Image and Video Library</li>
              <li>OSDR (Repositório de Ciência Aberta)</li>
              <li>SSC & TLE (Rastreamento de Satélites)</li>
              <li>SSD/CNEOS (Impacto de Meteoros)</li>
              <li>TechPort & TechTransfer (Patentes)</li>
              <li>Mars Rover Photos (Curiosity)</li>
            </ul>
          </div>
        </div>`;
    }

    function updateModuleUI(id) {
      const mod = MODULES[id];
      document.getElementById('mod-title').innerText = mod.title;
      document.getElementById('docs-panel').style.display = 'block';
      document.getElementById('status').style.display = 'flex';
      document.getElementById('mod-desc').innerText = mod.desc;
      document.getElementById('mod-call').innerText = mod.call;
      document.getElementById('mod-return').innerText = mod.return;

      const tipsBox = document.getElementById('mod-tips');
      if (mod.tips) { tipsBox.style.display = 'block'; tipsBox.innerHTML = mod.tips; }
      else { tipsBox.style.display = 'none'; }

      const controls = document.getElementById('mod-controls');

      if (mod.inputType === 'latlon') {
        controls.style.display = 'flex';
        controls.innerHTML = `
          <div class="input-group">
            <div class="input-label">Latitude</div>
            <input type="number" id="input-lat" step="0.01" placeholder="-23.55" value="-23.55">
          </div>
          <div class="input-group">
            <div class="input-label">Longitude</div>
            <input type="number" id="input-lon" step="0.01" placeholder="-46.63" value="-46.63">
          </div>
          <button class="btn" style="align-self: flex-end;" onclick="fetchData()">TRANSMITIR COMANDO</button>`;
      } else if (mod.inputType === 'date') {
        controls.style.display = 'flex';
        controls.innerHTML = `
          <input type="date" id="param-input" max="${new Date().toISOString().split('T')[0]}">
          <button class="btn" onclick="fetchData()">TRANSMITIR COMANDO</button>`;
        document.getElementById('param-input').addEventListener('keypress', e => { if (e.key === 'Enter') fetchData(); });
      } else if (mod.inputType === 'text') {
        controls.style.display = 'flex';
        controls.innerHTML = `
          <input type="text" id="param-input" placeholder="${mod.placeholder || ''}">
          <button class="btn" onclick="fetchData()">TRANSMITIR COMANDO</button>`;
        document.getElementById('param-input').addEventListener('keypress', e => { if (e.key === 'Enter') fetchData(); });
      } else {
        controls.style.display = 'none';
        fetchData();
      }

      document.getElementById('render-zone').innerHTML = '';
      document.getElementById('status').innerHTML = 'Aguardando comando do operador... <br><span style="color:var(--muted); font-size:11px;">(Pressione ENTER ou clique no botão para buscar)</span>';
    }

    async function fetchData() {
      const mod = MODULES[currentApiId];
      const status = document.getElementById('status');
      const renderZone = document.getElementById('render-zone');

      renderZone.innerHTML = '';
      status.innerHTML = '⏳ Estabelecendo conexão com o servidor FastAPI...';

      let url = `http://127.0.0.1:8000${mod.path}`;

      if (mod.inputType === 'latlon') {
        const lat = document.getElementById('input-lat')?.value;
        const lon = document.getElementById('input-lon')?.value;
        if (!lat || !lon) {
          status.innerHTML = '<span style="color:var(--amber)">⚠️ Informe latitude e longitude.</span>';
          return;
        }
        url += `?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
      } else if (mod.paramKey) {
        const param = document.getElementById('param-input')?.value;
        if (param) url += `?${mod.paramKey}=${encodeURIComponent(param)}`;
      }

      try {
        const res = await fetch(url);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
          throw new Error(errData.detail || `Erro HTTP ${res.status}`);
        }
        const data = await res.json();

        if (data && data.status === 'error_detalhado') {
          status.innerHTML = `<span style="color:var(--red)">❌ ${data.titulo}</span>`;
          renderZone.innerHTML = `
            <div class="alert-box">
              <h2>${data.titulo}</h2>
              <p>${data.mensagem}</p>
              <p style="margin-top:15px; color:var(--accent); font-size:13px; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
                <b>Como resolver:</b> ${data.solucao}
              </p>
              ${data.raw_detail ? `<p style="margin-top:10px; font-size:11px; color:var(--muted); font-family:monospace;">${data.raw_detail}</p>` : ''}
              <button class="btn" style="margin-top:20px; background:var(--red); color:#fff;" onclick="fetchData()">↺ TENTAR NOVAMENTE</button>
            </div>`;
          return;
        }

        status.innerHTML = '✅ Dados recebidos.';
        try {
          drawCoolStuff(currentApiId, data);
          status.innerHTML = '✅ Telemetria de interface renderizada com sucesso.';
        } catch (uiErr) {
          console.error(uiErr);
          status.innerHTML = '<span style="color:var(--amber)">⚠️ ERRO DE RENDERIZAÇÃO DA UI</span>';
          renderZone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        }
      } catch (err) {
        status.innerHTML = '<span style="color:var(--red)">❌ ERRO DE PROCESSAMENTO</span>';
        renderZone.innerHTML = `
          <div class="alert-box">
            <h2>CONEXÃO RECUSADA / SERVIDOR OFFLINE</h2>
            <p>O navegador não conseguiu contactar o servidor Backend.</p>
            <p style="margin-top:15px; color:var(--muted); font-size:12px;">Execute o comando abaixo no terminal:</p>
            <div class="code-cmd">python -m uvicorn main:app --reload</div>
          </div>`;
      }
    }

    function colorJSON(json) {
      let str = typeof json != 'string' ? JSON.stringify(json, null, 2) : json;
      str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
        let cls = 'syn-num';
        if (/^"/.test(match)) { cls = /:$/.test(match) ? 'syn-key' : 'syn-str'; }
        return `<span class="${cls}">${match}</span>`;
      });
    }

    function drawCoolStuff(id, data) {
      const zone = document.getElementById('render-zone');

      if (data.format === 'xml_raw') {
        return zone.innerHTML = `<div style="color:var(--muted);font-size:11px;margin-bottom:8px;">// RAW XML PAYLOAD</div><pre class="terminal">${data.preview.replace(/</g,'&lt;')}</pre>`;
      }
      if (data.format === 'empty_stable') {
        return zone.innerHTML = `
          <div class="alert-box" style="border-color:var(--green);background:rgba(63,185,80,0.1);padding:40px;">
            <h2 style="color:var(--green);font-size:32px;margin-bottom:15px;">🛡️ DEFESAS OPERACIONAIS ESTÁVEIS</h2>
            <p style="color:var(--text);font-size:16px;max-width:600px;margin:0 auto;line-height:1.8;">${data.mensagem}</p>
          </div>`;
      }

      if (data.status === 'offline_preservado') {
        const payload = data.payload;
        if (data.missao && data.missao.includes('Rover')) {
          let html = `<div class="alert-box" style="border-color:var(--amber);background:rgba(210,153,34,0.1);margin-bottom:24px;"><h2>📡 TELEMETRIA DE CONTINGÊNCIA ATIVADA</h2><p style="color:var(--text);">${data.mensagem}</p></div><div class="grid">`;
          payload.photos.forEach(p => {
            html += `<div class="card" onclick="openModal('${p.img_src}','Rover ${payload.rover}','Sol ${payload.sol} - Câmera: ${p.camera.name}')">
              <img class="card-img" src="${p.img_src}">
              <div class="card-body"><span class="tag danger">ARQUIVO HISTÓRICO</span>
              <div class="card-title">Câmera: ${p.camera.name}</div>
              <div class="card-info">Sol: ${payload.sol} (Terra: ${p.earth_date})</div></div></div>`;
          });
          return zone.innerHTML = html + '</div>';
        }
        return zone.innerHTML = `
          <div class="alert-box" style="border-color:var(--amber);background:rgba(210,153,34,0.1);margin-bottom:24px;">
            <h2>📡 TELEMETRIA DE CONTINGÊNCIA ATIVADA</h2><p style="color:var(--text);">${data.mensagem}</p>
          </div>
          <div class="apod-frame" style="margin-top:15px;">
            <img src="https://mars.nasa.gov/system/resources/detail_files/22197_InSight_lander-unlabeled_1200.jpg" style="max-width:400px;">
            <div class="apod-data">
              <span class="tag danger">MISSÃO ENCERRADA</span>
              <h2>Sonda InSight (Elysium Planitia)</h2>
              <p>Sol ${payload.sol} — Terra: ${payload.data_terrestre}</p>
              <div class="insight-dashboard">
                <div class="insight-widget"><div class="insight-label">Temp Máx</div><div class="insight-val" style="color:var(--red)">${payload.sensor_temperatura.maxima}</div></div>
                <div class="insight-widget"><div class="insight-label">Temp Mín</div><div class="insight-val" style="color:var(--accent)">${payload.sensor_temperatura.minima}</div></div>
                <div class="insight-widget"><div class="insight-label">Temp Média</div><div class="insight-val">${payload.sensor_temperatura.media}</div></div>
                <div class="insight-widget"><div class="insight-label">Pressão</div><div class="insight-val" style="color:var(--amber)">${payload.sensor_pressao}</div></div>
                <div class="insight-widget"><div class="insight-label">Vento Máx</div><div class="insight-val">${payload.sensor_vento.velocidade_maxima}</div></div>
                <div class="insight-widget"><div class="insight-label">Direção</div><div class="insight-val">${payload.sensor_vento.direcao_predominante}</div></div>
              </div>
            </div>
          </div>`;
      }

      if (Array.isArray(data) && data.length === 0) {
        return zone.innerHTML = `<div class="alert-box" style="padding:2rem;"><h2>VAZIO</h2><p>A NASA não retornou nenhum dado para esta consulta.</p></div>`;
      }

      // ── APOD ──
      if (id === 'apod') {
        const media = data.media_type === 'video'
          ? `<iframe src="${data.url}" height="400"></iframe>`
          : `<img src="${data.url}" style="cursor:zoom-in" onclick="openModal('${data.url}','${data.title.replace(/'/g,"&apos;")}','Data da Captura')">`;
        return zone.innerHTML = `
          <div class="apod-frame">
            ${media}
            <div class="apod-data">
              <span class="tag success">DESTAQUE DO DIA</span>
              <h2>${data.title}</h2>
              <div style="font-family:'Space Mono',monospace;color:var(--accent);font-size:12px;">Data: ${data.date}</div>
              <p>${data.explanation}</p>
            </div>
          </div>`;
      }

      // ── EARTH ASSETS ──
      if (id === 'earth') {
        if (!data.url && !data.date) {
          return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        }
        const imgUrl = data.url || '';
        const assetDate = data.date ? data.date.split('T')[0] : 'N/A';
        const assetId = data.id || 'N/A';
        const lat = document.getElementById('input-lat')?.value || 'N/A';
        const lon = document.getElementById('input-lon')?.value || 'N/A';

        return zone.innerHTML = `
          <div class="earth-frame">
            <img src="${imgUrl}" alt="Imagem Landsat 8"
              onerror="this.style.display='none'; document.getElementById('earth-img-err').style.display='block'">
            <div id="earth-img-err" style="display:none; width:480px; height:300px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;">
              <span style="color:var(--amber); font-size:24px;">🛰️</span>
              <span style="color:var(--muted); font-size:12px;">Imagem não disponível para pré-visualização direta.</span>
              <a href="${imgUrl}" target="_blank" class="btn" style="font-size:12px; padding:8px 16px;">Abrir imagem ↗</a>
            </div>
            <div class="earth-data">
              <span class="tag success">LANDSAT 8 — NASA/USGS</span>
              <h2>Imagem de Satélite</h2>
              <p style="color:var(--muted); font-size:13px; margin-top:8px; line-height:1.6;">
                Imagem capturada pelo satélite Landsat 8, resolução de 30 metros por pixel,
                banda multiespectral OLI/TIRS.
              </p>
              <div class="earth-meta">
                <div class="earth-meta-box">
                  <div class="earth-meta-label">Data da Captura</div>
                  <div class="earth-meta-val">${assetDate}</div>
                </div>
                <div class="earth-meta-box">
                  <div class="earth-meta-label">ID do Asset</div>
                  <div class="earth-meta-val" style="font-size:11px; word-break:break-all;">${assetId}</div>
                </div>
                <div class="earth-meta-box">
                  <div class="earth-meta-label">Latitude</div>
                  <div class="earth-meta-val">${lat}°</div>
                </div>
                <div class="earth-meta-box">
                  <div class="earth-meta-label">Longitude</div>
                  <div class="earth-meta-val">${lon}°</div>
                </div>
              </div>
              <a href="${imgUrl}" target="_blank" class="btn" style="display:inline-block; margin-top:20px; text-decoration:none;">
                🛰️ ABRIR IMAGEM COMPLETA ↗
              </a>
            </div>
          </div>`;
      }

      // ── EPIC ──
      if (id === 'epic') {
        if (!Array.isArray(data)) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = '<div class="grid">';
        data.slice(0, 6).forEach(img => {
          const dt = img.date.split(' ')[0].split('-');
          const url = `https://epic.gsfc.nasa.gov/archive/natural/${dt[0]}/${dt[1]}/${dt[2]}/png/${img.image}.png`;
          html += `<div class="card" onclick="openModal('${url}','Planeta Terra','Câmera EPIC - Satélite DSCOVR - ${img.date}')">
            <img class="card-img" src="${url}">
            <div class="card-body"><span class="tag">SATÉLITE DSCOVR</span>
            <div class="card-title">Hemisfério Iluminado</div>
            <div class="card-info">Captura: ${img.date}</div></div></div>`;
        });
        return zone.innerHTML = html + '</div>';
      }

      // ── NEOWS ──
      if (id === 'neows') {
        if (!data.near_earth_objects) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = '<div class="grid">';
        Object.keys(data.near_earth_objects).forEach(day => {
          (data.near_earth_objects[day] || []).slice(0, 6).forEach(ast => {
            const danger = ast.is_potentially_hazardous_asteroid;
            const size = ast.estimated_diameter?.meters?.estimated_diameter_max ? parseFloat(ast.estimated_diameter.meters.estimated_diameter_max).toFixed(1) : 'N/A';
            const vel = ast.close_approach_data?.[0]?.relative_velocity?.kilometers_per_hour ? parseFloat(ast.close_approach_data[0].relative_velocity.kilometers_per_hour).toFixed(0) : 'N/A';
            const appDate = ast.close_approach_data?.[0]?.close_approach_date || 'N/A';
            html += `<div class="card" style="cursor:default;${danger?'border-color:var(--red);box-shadow:0 0 20px rgba(248,81,73,0.2);':''}">
              <div class="card-body"><span class="tag ${danger?'danger':'success'}">${danger?'⚠ RISCO DE IMPACTO':'✓ ÓRBITA SEGURA'}</span>
              <div class="card-title">${ast.name}</div>
              <div class="card-info"><br>> Diâmetro Máx: <b>${size} m</b><br>> Velocidade: <b>${vel} km/h</b><br>> Aproximação: <b>${appDate}</b></div></div></div>`;
          });
        });
        return zone.innerHTML = html + '</div>';
      }

      // ── TECH TRANSFER ──
      if (id === 'tech') {
        const results = data.results || [];
        if (!Array.isArray(results) || !results.length) return zone.innerHTML = `<div class="alert-box"><h2>NADA ENCONTRADO</h2><p>Nenhuma patente indexada com esta palavra-chave.</p></div>`;
        let html = '<div class="grid">';
        results.forEach(p => {
          const img = p[10] || 'https://via.placeholder.com/400x200/161b22/58a6ff?text=BLUEPRINT+CONFIDENCIAL';
          const desc = p[3] ? p[3].replace(/<[^>]*>?/gm,'').substring(0,100) : 'Sem descrição';
          const title = p[2] || 'Patente';
          html += `<div class="card" onclick="openModal('${img}','${title.replace(/'/g,"&apos;")}','Patente: ${p[1]||'N/A'}')">
            <img class="card-img" src="${img}" onerror="this.src='https://via.placeholder.com/400x200/161b22/58a6ff?text=BLUEPRINT'">
            <div class="card-body"><span class="tag" style="border-color:var(--accent);color:var(--accent)">PATENTE: ${p[1]||'N/A'}</span>
            <div class="card-title">${title}</div>
            <div class="card-info">${desc}...</div></div></div>`;
        });
        return zone.innerHTML = html + '</div>';
      }

      // ── EXOPLANETS ──
      if (id === 'exoplanet') {
        if (!Array.isArray(data)) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = `<div class="table-container"><table><thead><tr>
          <th>Nome do Planeta</th><th>Estrela Hospedeira</th>
          <th>Período Orbital (Dias)</th><th>Ano Descobrimento</th><th>Método</th>
          </tr></thead><tbody>`;
        data.forEach(p => {
          html += `<tr><td style="color:var(--accent);font-weight:bold;">${p.pl_name}</td>
            <td>${p.hostname}</td><td>${p.pl_orbper?parseFloat(p.pl_orbper).toFixed(2):'N/A'}</td>
            <td>${p.disc_year}</td><td>${p.discoverymethod}</td></tr>`;
        });
        return zone.innerHTML = html + '</tbody></table></div>';
      }

      // ── EONET ──
      if (id === 'eonet') {
        const events = data.events;
        if (!Array.isArray(events) || !events.length) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = '<div class="grid">';
        events.slice(0,9).forEach(ev => {
          const cat = ev.categories?.[0]?.title || 'Evento Natural';
          html += `<div class="card" style="cursor:default;border-color:var(--amber);">
            <div class="card-body"><span class="tag" style="background:var(--amber);color:#000;border:none;">🚨 ${cat}</span>
            <div class="card-title">${ev.title||'Evento'}</div>
            <div class="card-info"><br>Em monitoramento ativo pelas agências globais.</div></div></div>`;
        });
        return zone.innerHTML = html + '</div>';
      }

      // ── LIBRARY / ROVERS ──
      if (id === 'library' || id === 'rovers') {
        let items = id === 'library' ? (data.collection?.items || []) : (data.photos || []);
        if (!Array.isArray(items) || !items.length) return zone.innerHTML = `<div class="alert-box"><h2>NADA ENCONTRADO</h2><p>Nenhuma mídia localizada.</p></div>`;
        let html = '<div class="grid">';
        items.slice(0,12).forEach(i => {
          const img = id === 'library' ? i.links?.[0]?.href : i.img_src;
          const title = id === 'library' ? (i.data?.[0]?.title||'Mídia Espacial') : `Rover ${i.rover?.name||''} - ${i.camera?.name||''}`;
          if (!img) return;
          html += `<div class="card" onclick="openModal('${img}','${title.replace(/'/g,"&apos;")}','Arquivo de Mídia')">
            <img class="card-img" src="${img}"><div class="card-body"><div class="card-title">${title}</div></div></div>`;
        });
        return zone.innerHTML = html + '</div>';
      }

      // ── TLE ──
      if (id === 'tle') {
        const item = data.member?.[0] || data;
        if (!item || !item.line1 || !item.line2) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        const inc = item.line2.substring(8,16).trim();
        const ecc = "0." + item.line2.substring(26,33).trim();
        const rev = item.line2.substring(52,63).trim();
        const period = (1440 / parseFloat(rev)).toFixed(2);
        return zone.innerHTML = `
          <div class="tle-telemetry">
            <span class="tag success">ID COSPAR: ${item.line1.substring(9,17).trim()}</span>
            <h2 style="font-family:'Syne',sans-serif;font-size:24px;color:#fff;">Sistemas Orbitais: ${item.name}</h2>
            <pre class="terminal" style="margin:15px 0;font-size:11px;">${item.line1}\n${item.line2}</pre>
            <div class="tle-grid">
              <div class="tle-box"><div class="tle-label">Inclinação</div><div class="tle-val">${inc}°</div></div>
              <div class="tle-box"><div class="tle-label">Excentricidade</div><div class="tle-val">${ecc}</div></div>
              <div class="tle-box"><div class="tle-label">Revoluções/Dia</div><div class="tle-val">${rev}</div></div>
              <div class="tle-box"><div class="tle-label">Período Orbital</div><div class="tle-val">~${period} min</div></div>
            </div>
          </div>`;
      }

      // ── SSD FIREBALLS ──
      if (id === 'ssd') {
        if (!data.data?.length) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = `<div style="margin-bottom:16px;font-size:12px;color:var(--accent);">// REGISTRO DE IMPACTOS ATMOSFÉRICOS DE METEOROS (SSD/CNEOS)</div>
          <div class="table-container"><table><thead><tr>
          <th>Data (UTC)</th><th>Energia (kt)</th><th>Velocidade (km/s)</th><th>Altitude Pico (km)</th><th>Coordenadas</th>
          </tr></thead><tbody>`;
        data.data.slice(0,15).forEach(row => {
          const coords = (row[4]&&row[6]) ? `${row[4]}°${row[5]} / ${row[6]}°${row[7]}` : 'N/A';
          html += `<tr><td style="color:var(--accent);font-weight:bold;">${row[0]||'N/A'}</td>
            <td style="color:var(--amber);">${row[1]||'N/A'} kt</td>
            <td>${row[3]?row[3]+' km/s':'N/A'}</td>
            <td>${row[8]?row[8]+' km':'N/A'}</td>
            <td style="font-family:'Space Mono',monospace;font-size:11px;">${coords}</td></tr>`;
        });
        return zone.innerHTML = html + '</tbody></table></div>';
      }

      // ── OSDR ──
      if (id === 'raw') {
        const hits = data.hits?.hits;
        if (!Array.isArray(hits) || !hits.length) return zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
        let html = '<div class="grid">';
        hits.forEach(hit => {
          const src = hit._source || {};
          html += `<div class="card" style="cursor:default;">
            <div class="card-body"><span class="tag" style="border-color:var(--accent2);color:var(--accent2)">OSD ID: ${src.Accession||'N/A'}</span>
            <div class="card-title">${src.title||'Estudo Espacial'}</div>
            <div class="card-info"><br>> Organismo: <b>${src.organism||'N/A'}</b><br>> Missão: <b>${src["Flight Program"]||'N/A'}</b></div></div></div>`;
        });
        return zone.innerHTML = html + '</div>';
      }

      zone.innerHTML = `<pre class="terminal">${colorJSON(data)}</pre>`;
    }

    function openModal(imgSrc, title, desc) {
      document.getElementById('modal').innerHTML = `
        <img src="${imgSrc}" alt="${title}">
        <div class="modal-body">
          <div class="modal-header">
            <div class="modal-title">${title}</div>
            <button class="close-btn" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
          </div>
          <div style="font-size:12px;color:var(--accent);">${desc}</div>
        </div>`;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
    });
  </script>
</body>
</html>
