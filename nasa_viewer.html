<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA — Foto Astronômica do Dia</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050810;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #58a6ff;
      --accent2: #bc8cff;
      --star: #f0c040;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
    }

    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 75% 85%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 50%, rgba(255,255,255,0.15) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: rgba(5, 8, 16, 0.8);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: var(--accent);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .logo-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type=date], select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    input[type=date]:hover, select:hover { border-color: var(--border-hover); }
    input[type=date]:focus, select:focus { border-color: var(--accent); }

    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }

    main {
      position: relative;
      z-index: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .status-bar {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .status-bar span { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeIn 0.4s ease both;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }

    .card-body { padding: 14px 16px; }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-date {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .card-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .card-tag.video { border-color: var(--accent2); color: var(--accent2); }

    /* Loading */
    .loading {
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
      border-radius: 12px 12px 0 0;
    }

    .modal-body { padding: 1.5rem; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--text);
      line-height: 1.3;
    }

    .close-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.2s, border-color 0.2s;
    }

    .close-btn:hover { color: var(--text); border-color: var(--border-hover); }

    .modal-meta {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      display: flex;
      gap: 16px;
    }

    .modal-meta span { color: var(--accent); }

    .modal-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
    }

    .modal-link {
      display: inline-block;
      margin-top: 1rem;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(88,166,255,0.3);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .modal-link:hover { border-color: var(--accent); }

    .error {
      text-align: center;
      padding: 3rem;
      color: #f85149;
      font-size: 13px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">NASA</div>
    <div>
      <div class="logo-title">APOD EXPLORER</div>
      <div class="logo-sub">astronomy picture of the day</div>
    </div>
  </div>
  <div class="controls">
    <input type="date" id="dateInput" />
    <select id="modeInput">
      <option value="random6">6 aleatórias</option>
      <option value="random12">12 aleatórias</option>
      <option value="date">Data específica</option>
    </select>
    <button class="btn" onclick="fetchPhotos()">▶ BUSCAR</button>
  </div>
</header>

<main>
  <div class="status-bar" id="statusBar">// aguardando busca...</div>
  <div id="grid" class="grid"></div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
  const API_KEY = "uU0HtIuSrObhlCycbYJGo2NhSph7mBOVnj8j05Jc";
  const dateInput = document.getElementById('dateInput');
  const modeInput = document.getElementById('modeInput');
  const grid = document.getElementById('grid');
  const statusBar = document.getElementById('statusBar');

  const today = new Date().toISOString().split('T')[0];
  dateInput.max = today;
  dateInput.value = today;

  async function fetchPhotos() {
    const mode = modeInput.value;
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>buscando dados da NASA...</div>';
    statusBar.innerHTML = '// conectando à API...';

    let url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}`;
    if (mode === 'random6') url += '&count=6';
    else if (mode === 'random12') url += '&count=12';
    else url += `&date=${dateInput.value}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const items = Array.isArray(data) ? data : [data];
      renderGrid(items);
      statusBar.innerHTML = `// <span>${items.length} foto${items.length > 1 ? 's' : ''} carregada${items.length > 1 ? 's' : ''}</span> — API key ativa`;
    } catch(e) {
      grid.innerHTML = `<div class="error">// erro: ${e.message}</div>`;
      statusBar.innerHTML = '// falha na conexão';
    }
  }

  function renderGrid(items) {
    grid.innerHTML = '';
    items.forEach((item, i) => {
      const isVideo = item.media_type === 'video';
      const imgSrc = isVideo
        ? `https://img.youtube.com/vi/${(item.url.split('/embed/')[1] || '').split('?')[0]}/hqdefault.jpg`
        : item.url;

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${i * 0.06}s`;
      card.innerHTML = `
        <img class="card-img" src="${imgSrc}" alt="${item.title}" onerror="this.style.minHeight='80px';this.style.background='#161b22'">
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <span class="card-date">${item.date}</span>
            <span class="card-tag ${isVideo ? 'video' : ''}">${isVideo ? 'vídeo' : 'imagem'}</span>
          </div>
        </div>`;
      card.onclick = () => openModal(item);
      grid.appendChild(card);
    });
  }

  function openModal(item) {
    const isVideo = item.media_type === 'video';
    const imgSrc = isVideo
      ? `https://img.youtube.com/vi/${(item.url.split('/embed/')[1] || '').split('?')[0]}/hqdefault.jpg`
      : item.url;

    document.getElementById('modal').innerHTML = `
      <img class="modal-img" src="${imgSrc}" alt="${item.title}">
      <div class="modal-body">
        <div class="modal-header">
          <div class="modal-title">${item.title}</div>
          <button class="close-btn" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
        </div>
        <div class="modal-meta">
          <div>data: <span>${item.date}</span></div>
          ${item.copyright ? `<div>crédito: <span>${item.copyright.trim()}</span></div>` : ''}
        </div>
        <div class="modal-desc">${item.explanation}</div>
        <a class="modal-link" href="${item.hdurl || item.url}" target="_blank">→ ver imagem em alta resolução</a>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
  });

  fetchPhotos();
</script>
</body>
</html>
